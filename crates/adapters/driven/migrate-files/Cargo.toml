[package]
name = "migrate-files"
version = "0.1.0"
description = "Text files as forms of the migrate registry: detect the version at the root and load into that version's typed object (JSON and TOML through serde; a YAML form is a consumer's), migrate in memory, and, for a form that can write, an explicit write-back with a backup taken first, through the file-system seam"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coded-diagnostic.workspace = true
file-system.workspace = true
migrate.workspace = true
os.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
file-system = { workspace = true, features = ["test-support"] }
migrate = { workspace = true, features = ["test-support"] }
mutants.workspace = true

[build-dependencies]
# The build writes the catalog's source under the crate's name
# (coded_diagnostic::build): no catalog spells its crate's name.
coded-diagnostic = { workspace = true, features = ["build"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []

[lints]
workspace = true
