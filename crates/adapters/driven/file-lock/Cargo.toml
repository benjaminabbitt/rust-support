[package]
name = "file-lock"
version = "0.1.0"
description = "Advisory file locks, taken one way by every binary sharing a lock file: flock on a lock file, re-checked against the file at its path, waited for a bounded time"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coded-diagnostic.workspace = true
file-system.workspace = true
# The advisory lock itself, and how a lock file records a path, per OS.
os.workspace = true

[dev-dependencies]
# Rendering catalogs' English (`english_for!`), for the tests that hold it
# to the expected text, and reading the catalog's messages and variables.
presentation = { workspace = true, features = ["test-support"] }
fluent-syntax.workspace = true
mutants.workspace = true
os = { workspace = true, features = ["test-support"] }

# The build writes the catalog's source under the crate's name
# (coded_diagnostic::build): no catalog spells its crate's name.
[build-dependencies]
coded-diagnostic = { workspace = true, features = ["build"] }

[features]
# `diagnostic_samples`, for other crates' catalog tests: their
# dev-dependency turns it on, and no build of a binary does.
test-support = []

[lints]
workspace = true
