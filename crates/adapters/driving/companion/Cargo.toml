[package]
name = "companion"
version = "0.1.0"
description = "The companion contract a host program reads from a tool it runs: `version --format json` and `loadout --format yaml`"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
diagnostic.workspace = true
presentation.workspace = true
exit-code.workspace = true
serde.workspace = true

[dev-dependencies]
presentation = { workspace = true, features = ["test-support"] }
fluent-syntax.workspace = true
serde_json.workspace = true
mutants.workspace = true

[features]
# `diagnostic_samples`, for a consumer's catalog test.
test-support = []

[build-dependencies]
diagnostic = { workspace = true, features = ["build"] }

[lints]
workspace = true
