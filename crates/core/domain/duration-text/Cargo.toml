[package]
name = "duration-text"
version = "0.2.0"
description = "A span written as text (1h30m, 2d, now) or a date, over jiff: parsed, formatted exactly or as an age, and a cutoff"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
coded-diagnostic.workspace = true
jiff.workspace = true

[dev-dependencies]
mutants.workspace = true

[build-dependencies]
# The build writes the catalog's source under the crate's name
# (coded_diagnostic::build): no catalog spells its crate's name.
coded-diagnostic = { workspace = true, features = ["build"] }

[lints]
workspace = true

[features]
# `diagnostic_samples`, for other crates' catalog tests.
test-support = []
