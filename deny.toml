# cargo-deny: what may enter the dependency graph. `just lint-deps` runs it.

[advisories]
version = 2
# RustSec advisories. An ignore needs the advisory id and why it does not
# apply here.
ignore = []

[licenses]
version = 2
# rust-support is Apache-2.0 OR BSD-3-Clause; every license here is permissive.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Not ignored: this workspace's own crates are `publish = false`, and their
# licenses are checked like any other's.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency has no version; allowed for unpublished crates only.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependency: every crate outside this workspace is from crates.io.
allow-git = []
