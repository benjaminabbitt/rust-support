[workspace]
resolver = "2"
members = ["crates/*/*/*"]

[workspace.package]
edition = "2021"
# The newest any dependency needs (angzarr-build in the consumers); a lower
# claim would be false for CI. ctxloom-rs, which declares 1.85, re-checks its
# own claim when it first links this repository.
rust-version = "1.96"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false

[workspace.dependencies]
# The angzarr crates are pinned to the SAME commit as the consumers
# (taskloom, ctxloom, cherenkov, angzarr-cli) pin them, so a consumer's lock
# holds one angzarr: a bump lands here first, then in each consumer, each
# green. Full commits, never a branch. All of them are crates of the one
# angzarr workspace (github.com/angzarr-io/angzarr).
angzarr-diagnostic = { git = "https://github.com/angzarr-io/angzarr", rev = "8159ea33c883486d71cae08691216a779f9fcfda" }
angzarr-yaml = { git = "https://github.com/angzarr-io/angzarr", rev = "8159ea33c883486d71cae08691216a779f9fcfda" }
angzarr-presentation = { git = "https://github.com/angzarr-io/angzarr", rev = "8159ea33c883486d71cae08691216a779f9fcfda" }
# The OS seam and the filesystem seam over it.
os = { git = "https://github.com/angzarr-io/angzarr", rev = "8159ea33c883486d71cae08691216a779f9fcfda" }
file-system = { git = "https://github.com/angzarr-io/angzarr", rev = "8159ea33c883486d71cae08691216a779f9fcfda" }
# The in-app runtime (its `sqlite` feature re-exports the SQLite store).
angzarr-embedded = { git = "https://github.com/angzarr-io/angzarr", rev = "8159ea33c883486d71cae08691216a779f9fcfda" }

# This repository's own crates.
cli-support = { path = "crates/adapters/driving/cli-support" }
config-layers = { path = "crates/adapters/driven/config-layers" }
sqlite-store-opener = { path = "crates/adapters/driven/sqlite-store-opener" }
process-env = { path = "crates/root/lib/process-env" }
project-dir = { path = "crates/adapters/driven/project-dir" }
run-within = { path = "crates/adapters/driven/run-within" }
fixture-program = { path = "crates/adapters/driven/fixture-program" }
duration-text = { path = "crates/core/domain/duration-text" }
exit-code = { path = "crates/core/domain/exit-code" }
arch-lint = { path = "crates/root/bin/arch-lint" }

# The command-line parser and the serializer the CLI shims read and write with.
clap = "4.5"
serde = { version = "1", features = ["derive"] }

# The dependency graph as cargo reports it (arch-lint), and the rules file it
# reads.
cargo_metadata = "0.23"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# The runtime the store's tests run its async opens on.
tokio = { version = "1", features = ["rt", "time"] }

# `#[mutants::skip]`, for a mutant judged equivalent.
mutants = "0.0.4"

[workspace.lints.clippy]
invisible_characters = "deny"
unicode_not_nfc = "deny"
non_ascii_literal = "deny"
# Complexity, at clippy's defaults except nesting, whose threshold is in
# clippy.toml.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
