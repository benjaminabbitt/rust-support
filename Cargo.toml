[workspace]
resolver = "2"
members = ["crates/*/*/*"]

[workspace.package]
edition = "2021"
# The newest any crate here needs (os and file-system); a lower claim would
# be false for CI. diagnostic, presentation and test-dir claim their own,
# lower one, which the runtimes built on them hold. A consumer declaring an
# older one re-checks its claim when it first links this repository.
rust-version = "1.96"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false

[workspace.dependencies]
# This repository's own crates.
cli-support = { path = "crates/adapters/driving/cli-support" }
companion = { path = "crates/adapters/driving/companion" }
config-layers = { path = "crates/adapters/driven/config-layers" }
process-env = { path = "crates/root/lib/process-env" }
project-dir = { path = "crates/adapters/driven/project-dir" }
run-within = { path = "crates/adapters/driven/run-within" }
fixture-program = { path = "crates/adapters/driven/fixture-program" }
duration-text = { path = "crates/core/domain/duration-text" }
exit-code = { path = "crates/core/domain/exit-code" }
arch-lint = { path = "crates/root/bin/arch-lint" }
# The platform seams: what differs between operating systems, and the
# filesystem seam over it; advisory file locks through both.
os = { path = "crates/adapters/driven/os" }
file-system = { path = "crates/adapters/driven/file-system" }
file-lock = { path = "crates/adapters/driven/file-lock" }
# Localizable errors (pure), and their rendering at the driving edge.
diagnostic = { path = "crates/core/domain/diagnostic" }
presentation = { path = "crates/adapters/driving/presentation" }
# A test's scratch directory, for a crate below the file-system seam.
test-dir = { path = "crates/adapters/driven/test-dir" }

# The command-line parser and the serializer the CLI shims read and write with.
clap = "4.5"
serde = { version = "1.0.228", features = ["derive"] }

# The dependency graph as cargo reports it (arch-lint), and the rules file it
# reads.
cargo_metadata = "0.23"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# The runtime the os crate's signals are made on.
tokio = { version = "1", features = ["rt", "time"] }

# The os crate's host: advisory locks, the other flavor's paths, the
# process tree kill, and the per-OS syscalls.
fs4 = "1.1"
typed-path = "=0.12.3"
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group"] }
libc = "0.2"
junction = "=2.1.0"
same-file = "=1.0.6"
windows-sys = "=0.61.2"
# The file-system seam's staged writes and temporary roots.
tempfile = "3"

# Fluent, the catalogs' format: its parser (the catalog checks), its
# runtime and language negotiation (presentation's renderer).
fluent-syntax = "0.11.1"
fluent-bundle = "0.15.3"
fluent-langneg = "0.13.1"
unic-langid = "0.9.6"
# The JSON format, and display-width columns in text output.
serde_json = "1.0.149"
unicode-width = "0.2.2"

# `#[mutants::skip]`, for a mutant judged equivalent.
mutants = "0.0.4"

[workspace.lints.clippy]
invisible_characters = "deny"
unicode_not_nfc = "deny"
non_ascii_literal = "deny"
# Complexity, at clippy's defaults except nesting, whose threshold is in
# clippy.toml.
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
